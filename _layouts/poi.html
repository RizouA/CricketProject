---
layout: default
load_leaflet: 1
---

<div style="text-align:center; margin: 1rem 0 0.5rem 0;">
  <h1 style="margin:0; font-size:2.5rem; color:#4a2b0f;">
    {{ page.title }}
  </h1>

  <h2 id="wikidata_title"
      style="margin:0.5rem 0 0; font-size:1.4rem; font-weight:normal; color:#70401a;">
  </h2>

  <h3 id="wikidata_descr"
      style="margin:0.25rem 0 0; font-size:1rem; font-weight:normal; color:#7a5a3a;">
  </h3>
</div>


<img id="wikidata_img"
     alt="Wikidata image"
     style="width:100%; display:none; margin:0 auto; padding-bottom:10px; border-radius:12px; box-shadow:0 0 6px rgba(0,0,0,0.2)">

{% if page.top_image %}
  <figure style="text-align:center; margin: 1.5rem 0;">
    <img src="{{ page.top_image }}" alt="{{ page.title }}" style="max-width:90%; border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,0.25);">
    
    {% if page.top_image_credit or page.top_image_credit_url %}
      <figcaption style="font-size:0.9rem; color:#666; margin-top:0.5rem;">
        Πηγή:
        {% if page.top_image_credit_url %}
          <a href="{{ page.top_image_credit_url }}" target="_blank" rel="noopener">
        {% endif %}
        
        {{ page.top_image_credit | default: page.top_image_credit_url }}
        
        {% if page.top_image_credit_url %}
          </a>
        {% endif %}
      </figcaption>
    {% endif %}
  </figure>
{% endif %}


{% if page.image %}
  <div style="text-align:center; margin: 1.5rem 0;">
    <img src="{{ page.image | relative_url }}" alt="{{ page.title }}" style="max-width:90%; border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,0.2);">
  </div>
{% endif %}

<div id="map" style="height: 300px; width:100%; background-color:#f6f6f6; margin-bottom:1rem;"></div>


{{ content }}


<p style="text-align:center; margin-top:1em;">
 <p>
  <a id="wikidata_href" href="#" target="_blank">
    Άρθρο στη Wikipedia
  </a>
 </p>

{% if page.official_url %}
 <p>
  <a href="{{ page.official_url }}" target="_blank" style="color:#7a3e00; font-weight:bold;">
    Επίσημος ιστότοπος
  </a>
 </p>
{% endif %}

{% if page.facebook_url %}
 <p>
  <a href="{{ page.facebook_url }}" target="_blank" style="color:#3b5998; font-weight:bold;">
    Σελίδα στο Facebook
  </a>
 </p>
{% endif %}
<p>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"
        integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
        crossorigin="anonymous"></script>


<script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js"
        integrity="sha512-BB3hKbKWOc9Ez/TAwyWxNXeoV9c1v6FIeYiBieIWkpLjauysF18NzgR1MBNBXf8/KABdlkX68nAhlwcDFLGPCQ=="
        crossorigin=""></script>
<script src="https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/Leaflet.fullscreen.min.js"></script>


<script>var wikidatum = '{{ page.wikidatum }}'</script>


<script src="{{ '/assets/js/get_wiki_item.js' | relative_url }}"></script>


<script>
 
  function setPlaceholderIfEmpty() {
    const img = document.getElementById('wikidata_img');
    if (!img.getAttribute('src') || img.getAttribute('src').trim() === '') {
      img.src = '/static/img/default-placeholder.jpg';
    }
  }

 
  window.addEventListener('load', () => setTimeout(setPlaceholderIfEmpty, 3000));
</script>
